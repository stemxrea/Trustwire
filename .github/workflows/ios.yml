name: iOS Simulator & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ios-build:
    name: iOS Simulator Build (Xcode)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Generate ios/ native project (expo prebuild)
        # Generates ios/Trustwire.xcworkspace which can be opened in Xcode.
        # The ios/ folder is gitignored; it is always produced fresh in CI.
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Build for iOS Simulator with xcodebuild
        run: |
          xcodebuild \
            -workspace ios/Trustwire.xcworkspace \
            -scheme Trustwire \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build | xcpretty --color || xcodebuild \
            -workspace ios/Trustwire.xcworkspace \
            -scheme Trustwire \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS Simulator .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/Build/Products/Debug-iphonesimulator/Trustwire.app
          retention-days: 7
