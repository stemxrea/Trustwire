name: iOS Simulator & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ios-build:
    name: iOS Simulator Build
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Export iOS bundle
        run: npx expo export --platform ios --no-bytecode
        env:
          CI: true

      - name: Upload iOS bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-bundle
          path: dist/
          retention-days: 7
