name: iOS Simulator & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ios-build:
    name: iOS Simulator Build (local)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Build development client for iOS Simulator (local)
        # --local runs the Xcode build directly on this macOS runner.
        # Requires EXPO_TOKEN repository secret for EAS project lookup.
        # Add EXPO_TOKEN via: GitHub repo → Settings → Secrets → Actions.
        run: eas build --profile development --platform ios --local --non-interactive --output ./build/trustwire-simulator.tar.gz
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload iOS Simulator build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-build
          path: build/trustwire-simulator.tar.gz
          retention-days: 7
